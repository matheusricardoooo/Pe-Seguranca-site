<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Orçamento</title>
    <link rel="stylesheet" href="orcamento.css">
</head>

<body>
    <main id="orcamento">
        <div class="left">
            <img class="orcamento-funcionario" src="../../pages/orcamento/assets/img-solicitar-orcamento.png"
                alt="Especialista em segurança eletrônica segurando uma solicitação de orçamento">
        </div>
        <div class="right">
            <h1 class="orcamento-titulo">Vamos encontrar a melhor solução para <span class="color"> você</span></h1>

            <div class="card-form-solicitar">
                <div class="protecao">
                    <h2 class="card-form-titulo">
                        O que você deseja proteger?
                    </h2>
                    <button class="card-form-button is-selected" type="button" aria-pressed="true">
                        <img src="assets/house.svg" alt="casa">
                        <h3 class="card-form-subtitulo">
                            Residência
                        </h3>
                    </button>
                    <button class="card-form-button" type="button" aria-pressed="false">
                        <img src="assets/building.svg" alt="empresa">
                        <h3 class="card-form-subtitulo">
                            Empresa
                        </h3>
                    </button>
                    <button class="card-form-button" type="button" aria-pressed="false">
                        <img src="assets/storefront.svg" alt="carro">
                        <h3 class="card-form-subtitulo">
                            Comercio
                        </h3>
                    </button>
                </div>

                <div class="protection">
                    <div class="protecao">
                        <h2 class="card-form-titulo">
                            Quais áreas precisam de proteção?
                        </h2>
                        <button class="btn-protecao is-selected" type="button" aria-pressed="true">
                            <img src="assets/door.svg" alt="entrada">
                            <h3 class="btn-protecao-subtitulo">
                                Entrada
                            </h3>
                        </button>
                        <button class="btn-protecao" type="button" aria-pressed="false">
                            <img src="assets/house-line.svg" alt="empresa">
                            <h3 class="btn-protecao-subtitulo">
                                Área Interna
                            </h3>
                        </button>
                        <button class="btn-protecao" type="button" aria-pressed="false">
                            <img src="assets/tree.svg" alt="externa">
                            <h3 class="btn-protecao-subtitulo">
                                Área Externa
                            </h3>
                        </button>
                        <button class="btn-protecao" type="button" aria-pressed="false">
                            <img src="assets/car.svg" alt="garagem">
                            <h3 class="btn-protecao-subtitulo">
                                Garagem
                            </h3>
                        </button>
                        <button class="btn-protecao" type="button" aria-pressed="false">
                            <img src="assets/lock.svg" alt="acesso restrito">
                            <h3 class="btn-protecao-subtitulo">
                                Acesso Restrito
                            </h3>
                        </button>
                        <button class="btn-protecao" type="button" aria-pressed="false">
                            <img src="assets/barricade.svg" alt="portão">
                            <h3 class="btn-protecao-subtitulo">
                                Portão
                            </h3>
                        </button>
                        <button class="btn-protecao is-selected" type="button" aria-pressed="true">
                            <img src="assets/swimming-pool.svg" alt="área de lazer">
                            <h3 class="btn-protecao-subtitulo">
                                Área de Lazer
                            </h3>
                        </button>
                        <button class="btn-protecao" type="button" aria-pressed="false">
                            <img src="assets/dots-three-circle.svg" alt="outros">
                            <h3 class="btn-protecao-subtitulo">
                                Outros
                            </h3>
                        </button>
                    </div>
                </div>

                <div class="upgrade">

                    <h2 class="card-form-titulo">
                        O que você precisa melhorar?
                    </h2>    

                    <button class="btn-melhora is-selected" type="button" aria-pressed="true">
                        <img src="assets/eye.svg" alt="monitorar">
                        <h3 class="btn-protecao-subtitulo">
                            Monitorar Ambiente
                        </h3>
                    </button>

                    <button class="btn-melhora" type="button" aria-pressed="false">
                        <img src="assets/key.svg" alt="chave">
                        <h3 class="btn-protecao-subtitulo">
                            Controle de Acesso
                        </h3>
                    </button>

                    <button class="btn-melhora is-selected" type="button" aria-pressed="true">
                        <img src="assets/warning.svg" alt="aviso">
                        <h3 class="btn-protecao-subtitulo">
                            Previnir Invasão
                        </h3>
                    </button>

                    <button class="btn-melhora is-selected" type="button" aria-pressed="true">
                        <img src="assets/device-mobile-camera.svg" alt="celular">
                        <h3 class="btn-protecao-subtitulo">
                            Monitorar à distância
                        </h3>
                    </button>

                    <button class="btn-melhora" type="button" aria-pressed="false">
                        <img src="assets/shield-check.svg" alt="escudo">
                        <h3 class="btn-protecao-subtitulo">
                            Ampliar Segurança
                        </h3>
                    </button>

                    <button class="btn-melhora" type="button" aria-pressed="false">
                        <img src="assets/question-mark.svg" alt="interrogação">
                        <h3 class="btn-protecao-subtitulo">
                            Ainda não sei
                        </h3>
                    </button>
                </div>

                <div class="dados-cliente">
                    <h2 class="card-form-titulo">
                        Seus dados
                    </h2>

                    <div class="campo-nome">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
                    </div>

                    <div class="campo-email">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Digite seu email">
                    </div>

                    <div class="campo-cpf">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" placeholder="Digite seu CPF">
                    </div>

                    <div class="campo-local">
                        <label for="local">Local</label>
                        <input type="text" id="local" name="local" placeholder="Digite sua local">
                    </div>

                    <div class="campo-telefone">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" placeholder="Digite seu telefone">
                    </div>

                    <div class="tipo-pessoa">
                        <span class="pergunta">Qual seu tipo de pessoa?</span>
                        <label class="opcao-radio" for="fisica">
                            <input type="radio" id="fisica" name="tipo-pessoa" value="fisica" checked>
                            <span>PF (Pessoa física)</span>
                        </label>
                        <label class="opcao-radio" for="juridica">
                            <input type="radio" id="juridica" name="tipo-pessoa" value="juridica">
                            <span>PJ (Pessoa Jurídica)</span>
                        </label>
                    </div>

                    <div class="equipamento">
                        <span class="pergunta">Já possui algum equipamento no local?</span>
                        <label class="opcao-radio" for="sim">
                            <input type="radio" id="sim" name="equipamento" value="sim" checked>
                            <span>Sim</span>
                        </label>
                        <label class="opcao-radio" for="nao">
                            <input type="radio" id="nao" name="equipamento" value="nao">
                            <span>Não</span>
                        </label>
                    </div>

                    <div class="pesquisa">
                        <label for="descobrimento">Como descobriu a empresa?</label>
                        <select id="descobrimento" name="descobrimento">
                            <option value="google">Site</option>
                            <option value="instagram">Instagram</option>
                            <option value="indicação">Indicação</option>
                            <option value="whatsapp">Whatsapp</option>
                            <option value="outros">Outros</option>
                        </select>
                    </div>
                </div>

                <div class="enviar">
                    <button class="btn-enviar">
                        Enviar Formulário
                        <img src="assets/arrow-right.svg" alt="enviar">
                    </button>
            </div>
        </div>
    </main>
    <script src="orcamento.js" defer></script>
</body>
</html>
